<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusHaat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply dark mode immediately to prevent flash of white content
      (function() {
        var theme = localStorage.getItem('campushaat_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        }
        // Default is dark (class already on <html>), so no action needed for dark/null
      })();
    </script>
    <style>
      /* Prevent flash of white: set dark background before CSS loads */
      html, body { background-color: #090D16; color: #F9FAFB; }
      html:not(.dark), html:not(.dark) body { background-color: #F8FAFC; color: #0F172A; }
    </style>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
